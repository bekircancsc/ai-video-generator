# Renders the next episode and publishes it, without a machine at home being on.
#
# Daily at 20:17 Europe/Istanbul. GitHub cron is UTC and Turkey is UTC+3 the
# whole year, so 17:17 UTC. The odd minute is deliberate: scheduled runs are
# queued best-effort and the top of the hour is when everyone else's are too.
#
# This is meant to be the only schedule. The local n8n instance published the
# same arc from the same history.json every morning, and two schedules put out
# two parts a day, so it has to stay deactivated.

name: Publish a video

on:
  schedule:
    - cron: "00 16 * * *"

  workflow_dispatch:
    inputs:
      series:
        description: One arc to publish the next unpublished part of, instead of the queue
        default: scripts/floor-four
        required: true
      dry-run:
        description: Render only. Nothing is uploaded and no episode is consumed.
        type: boolean
        default: false

# One at a time. Two concurrent runs would each pick the same "next" episode,
# because the history that decides it is only written at the end.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      # To push the history entry back. Nothing else needs writing.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Remotion renders through headless Chrome and fetches its own copy on
      # first use. Cached, because it is ~150 MB and does not change between
      # runs of the same Remotion version.
      - name: Cache the browser Remotion renders with
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # A scheduled run carries no inputs at all, so the queue has to fall back
      # to the literal below. Without it the schedule renders `--series ""` and
      # fails nightly, while the button next to it keeps working.
      #
      # SERIES_QUEUE is the whole schedule, one arc per line, played in the
      # order written. `--series` is repeatable and an arc with no parts written
      # yet is skipped rather than refused, so the next arc can be named here
      # before a word of it exists: starting it is then dropping
      # `<name>-part-1.json` into `scripts/`, with nothing to change here. When
      # the arc in front runs out the run moves to the one below it the same
      # night, instead of failing until someone notices.
      - name: Render
        env:
          SCRIPT_PROVIDER: groq
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TTS_VOICE: daniel
          SERIES_OVERRIDE: ${{ inputs.series }}
          SERIES_QUEUE: |
            scripts/floor-four
            scripts/night-shift
            scripts/do-not-answer
            scripts/before-this-one
        run: |
          # The button publishes one named arc; the schedule plays the queue.
          arcs="${SERIES_OVERRIDE:-$SERIES_QUEUE}"
          args=()

          while IFS= read -r arc; do
            # Blank lines are the block scalar's trailing newline and the
            # indentation people leave behind, not arcs.
            arc="$(echo "$arc" | tr -d '[:space:]')"
            [ -n "$arc" ] && args+=(--series "$arc")
          done <<< "$arcs"

          if [ ${#args[@]} -eq 0 ]; then
            echo "No arc queued: SERIES_QUEUE is empty." >&2
            exit 1
          fi

          node run.mjs "${args[@]}" --json > render.json

      # Separately from the render, so a failed upload leaves the video to look
      # at rather than only a log saying it existed.
      - name: Keep the video whatever happens next
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/*.mp4
            out/*.jpg
            render.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish
        if: ${{ !inputs.dry-run }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node --import tsx src/pipeline/publish.ts --result render.json

      # The arc's position lives in history.json, so a run that does not commit
      # it publishes the same episode again tomorrow. A dry run deliberately
      # does not: it consumed nothing.
      # The only thing that speaks when the render does not. The Publish step
      # carries the Telegram message, and a failed render skips it, which is
      # exactly how two nights went missing without anyone being told. Runs on
      # any failure: a spent speech quota, an empty queue, a refused upload.
      #
      # It cannot help if `npm ci` is what failed, because tsx would not be
      # installed to run it. Everything after that point is covered.
      - name: Say why nothing was published
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node --import tsx src/pipeline/alert.ts --result render.json

      - name: Record the episode
        if: ${{ !inputs.dry-run }}
        run: |
          if git diff --quiet history.json; then
            echo "history.json unchanged — nothing to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "Published $(node -p "require('./render.json').title")"
          git push
